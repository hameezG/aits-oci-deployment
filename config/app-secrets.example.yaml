# Example only. Verify values against your application before deployment.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  DATABASE_URL: mysql+pymysql://APP_USER:URL_ENCODED_PASSWORD@PRIVATE_DB_HOST:3306/genius_hub
  JWT_SECRET_KEY: REPLACE_WITH_A_LONG_RANDOM_SECRET
  JWT_ALGORITHM: HS256
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: '1440'
  CORS_ORIGINS: '["http://FRONTEND_HOST", "http://ADMIN_HOST"]'
  OPENAI_API_KEY: ''
  GEMINI_API_KEY: REPLACE_WITH_YOUR_KEY
  ORACLE_STORAGE_PREFIX: genius-hub-assets
  ORACLE_ACCESS_KEY_ID: REPLACE_WITH_YOUR_ACCESS_KEY
  ORACLE_SECRET_ACCESS_KEY: REPLACE_WITH_YOUR_SECRET_KEY
  ORACLE_REGION: ap-singapore-1
  ORACLE_BUCKET: genius-hub-assets
  ORACLE_NAMESPACE: YOUR_OCIR_NAMESPACE
  ORACLE_ENDPOINT: https://YOUR_OCIR_NAMESPACE.compat.objectstorage.ap-singapore-1.oraclecloud.com
  ORACLE_URL: https://YOUR_OCIR_NAMESPACE.compat.objectstorage.ap-singapore-1.oraclecloud.com
  No_of_Questions_in_Quiz: '10'
