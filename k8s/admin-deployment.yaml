apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  labels:
    app: admin

spec:
  replicas: 1

  selector:
    matchLabels:
      app: admin

  template:
    metadata:
      labels:
        app: admin

    spec:
      containers:
      - name: admin
        image: ap-singapore-1.ocir.io/YOUR_OCIR_NAMESPACE/aits/admin:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 3001

        livenessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 5

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      imagePullSecrets:
      - name: ocir-secret

---
apiVersion: v1
kind: Service
metadata:
  name: admin-service
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"

spec:
  selector:
    app: admin

  ports:
  - port: 80
    targetPort: 3001

  type: LoadBalancer
